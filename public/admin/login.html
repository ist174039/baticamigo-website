<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaticAmigo - Login Administrativo</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body class="admin-body">
    <div class="admin-container">
        <div class="admin-login-card">
            <div class="admin-logo">
                <img src="../images/logo.png" alt="BaticAmigo Logo">
            </div>
            <h2>Acesso Administrativo</h2>
            
            <div id="login-error" class="admin-error-message"></div>
            
            <form id="login-form" class="admin-form">
                <div class="admin-form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="admin-form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="admin-btn primary-btn">Entrar</button>
            </form>
            
            <div class="admin-reset-password">
                <a href="#" id="reset-password-link">Esqueceu a senha?</a>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>

    <!-- Depois carregamos nossa configuração -->
    <script type="module" src="js/firebaseConfig.js"></script>

    <!-- E finalmente o script de autenticação -->
    <script type="module" src="js/auth.js"></script>
</body>
</html>
