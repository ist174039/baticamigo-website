name: Quality gate
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:secrets
      - run: npm audit --omit=dev --audit-level=high
      - name: Validate change title
        env:
          CHANGE_TITLE: ${{ github.event.pull_request.title || github.event.head_commit.message }}
        run: node scripts/check-change-title.mjs "$CHANGE_TITLE"
      - run: npm run check:release
      - run: npm run check:sbom
      - run: npm test
      - run: npm run lint
      - name: Verify authenticated flows in isolated Firebase emulators
        env:
          FIREBASE_EMULATORS_PATH: /tmp/baticamigo-emulators
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          npx --yes firebase-tools@14.22.0 emulators:exec --project baticamigo-c0384 --config tests/emulators/firebase.json --only auth,firestore 'node scripts/integration-test.mjs && node scripts/recovery-test.mjs'
      - name: Verify production Firestore public/private rules
        env:
          FIREBASE_EMULATORS_PATH: /tmp/baticamigo-emulators
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          npx --yes firebase-tools@14.22.0 emulators:exec --project baticamigo-c0384 --config firebase.json --only auth,firestore,storage 'node scripts/public-rules-test.mjs'
      - run: npm run build
      - run: node scripts/production-smoke.mjs
      - name: Automated WCAG smoke with axe
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3104 >/tmp/baticamigo-a11y.log 2>&1 &
          NEXT_PID=$!
          trap 'kill $NEXT_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3104/ >/dev/null; then break; fi
            sleep 0.5
          done
          curl --fail --silent http://127.0.0.1:3104/ >/dev/null
          npx --yes @axe-core/cli@4.14.0 http://127.0.0.1:3104/ --tags wcag2a,wcag2aa,wcag22aa --chrome-options="no-sandbox,disable-dev-shm-usage" --load-delay=1000 --timeout=60 --exit
          npx --yes @axe-core/cli@4.14.0 http://127.0.0.1:3104/platform/login --tags wcag2a,wcag2aa,wcag22aa --chrome-options="no-sandbox,disable-dev-shm-usage" --load-delay=1000 --timeout=60 --exit
