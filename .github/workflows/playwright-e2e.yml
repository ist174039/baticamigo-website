name: Playwright browser and document E2E
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-e2e:
    name: Browser E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install pinned browser test runner
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @playwright/test@1.56.1
      - name: Install test browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Browser E2E with local Firebase emulators and synthetic users only
        env:
          CI: 'true'
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          npx --yes firebase-tools@14.22.0 emulators:exec --project baticamigo-c0384 --config firebase.json --only auth,firestore,storage 'npx playwright test --project=${{ matrix.browser }}'
      - name: Preserve failure traces without real personal data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: baticamigo-playwright-e2e-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
